[project]
name = "harness"
version = "0.1.0"
description = "Load generator, approver, chaos and scoreboard for the returns agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
